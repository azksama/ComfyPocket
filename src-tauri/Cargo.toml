[package]
name = "comfy-pocket"
version = "0.5.0"
description = "Client Android privé pour ComfyUI"
edition = "2021"

[lib]
name = "comfy_pocket_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
tokio = { version = "1", features = ["fs"] }
tauri-plugin-pocket = { path = "pocket-plugin" }

[profile.release]
lto = true
codegen-units = 1
strip = true
